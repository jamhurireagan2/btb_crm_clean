<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .splash {
            text-align: center;
            color: white;
        }
        .splash .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            font-weight: 800;
            color: #dc2626;
        }
        .splash h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .splash p {
            opacity: 0.8;
            margin-top: 8px;
        }
        .splash .loader {
            margin-top: 20px;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo">C</div>
        <h1>Client Management System</h1>
        <p>Loading your dashboard...</p>
        <div class="loader"></div>
    </div>
</body>
</html>
