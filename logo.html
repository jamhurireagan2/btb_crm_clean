<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Management System Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f1f5f9;
            font-family: 'Inter', Arial, sans-serif;
            padding: 20px;
        }

        .logo-wrapper {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 100%;
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.02);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Shield Icon */
        .shield {
            position: relative;
            width: 80px;
            height: 95px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            clip-path: polygon(50% 0%, 100% 15%, 100% 70%, 50% 100%, 0% 70%, 0% 15%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.4);
            flex-shrink: 0;
        }

        .shield .letter {
            font-size: 42px;
            font-weight: 900;
            color: white;
            margin-top: -5px;
            font-family: 'Inter', Arial, sans-serif;
        }

        .shield .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 28px;
            height: 28px;
            background: #fbbf24;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            color: #1e293b;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
            font-family: 'Inter', Arial, sans-serif;
        }

        /* Text */
        .text-group {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .text-group .main {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            font-family: 'Inter', Arial, sans-serif;
        }

        .text-group .main .red {
            color: #dc2626;
        }

        .text-group .sub {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 2px;
            font-family: 'Inter', Arial, sans-serif;
        }

        .text-group .line {
            width: 220px;
            height: 3px;
            background: linear-gradient(90deg, #dc2626, rgba(220, 38, 38, 0.2));
            border-radius: 2px;
            margin-top: 8px;
        }

        /* Download Button */
        .download-btn {
            margin-top: 25px;
            padding: 12px 35px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
        }

        .download-btn i {
            margin-right: 8px;
        }

        .hint {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .logo-wrapper {
                padding: 25px 20px;
            }
            .logo-container {
                flex-direction: column;
                gap: 15px;
            }
            .shield {
                width: 60px;
                height: 72px;
            }
            .shield .letter {
                font-size: 32px;
            }
            .shield .badge {
                width: 22px;
                height: 22px;
                font-size: 10px;
                top: -6px;
                right: -6px;
            }
            .text-group .main {
                font-size: 24px;
            }
            .text-group .sub {
                font-size: 10px;
                letter-spacing: 3px;
            }
            .text-group .line {
                width: 180px;
            }
            .download-btn {
                padding: 10px 25px;
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .text-group .main {
                font-size: 20px;
            }
            .text-group .line {
                width: 140px;
            }
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <!-- Logo Display -->
        <div class="logo-container" id="logoContainer">
            <div class="shield">
                <span class="letter">C</span>
                <span class="badge">RJ</span>
            </div>
            <div class="text-group">
                <div class="main">
                    Client <span class="red">Management</span>
                </div>
                <div class="sub">System</div>
                <div class="line"></div>
            </div>
        </div>

        <!-- Download Button -->
        <button class="download-btn" onclick="downloadLogo()">
            📥 Download Logo PNG
        </button>
        <div class="hint">Click the button above to download as transparent PNG</div>
    </div>

    <script>
        function downloadLogo() {
            // Create a canvas
            const canvas = document.createElement('canvas');
            
            // Set canvas size (higher resolution for better quality)
            const scale = 2;
            canvas.width = 600 * scale;
            canvas.height = 180 * scale;
            const ctx = canvas.getContext('2d');
            
            // Scale everything up
            ctx.scale(scale, scale);

            // ---- Clear with transparent background ----
            ctx.clearRect(0, 0, 600, 180);

            // ==========================================
            // 1. SHIELD ICON (Left)
            // ==========================================
            const shieldX = 40;
            const shieldY = 25;
            const shieldWidth = 90;
            const shieldHeight = 110;

            // Shield gradient
            const gradient = ctx.createLinearGradient(shieldX, shieldY, shieldX + shieldWidth, shieldY + shieldHeight);
            gradient.addColorStop(0, '#dc2626');
            gradient.addColorStop(1, '#b91c1c');

            // Shadow
            ctx.shadowColor = 'rgba(220, 38, 38, 0.4)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 5;

            // Draw shield
            ctx.beginPath();
            ctx.moveTo(shieldX + shieldWidth / 2, shieldY);
            ctx.lineTo(shieldX + shieldWidth, shieldY + 18);
            ctx.lineTo(shieldX + shieldWidth, shieldY + 65);
            ctx.quadraticCurveTo(shieldX + shieldWidth, shieldY + 95, shieldX + shieldWidth / 2, shieldY + shieldHeight);
            ctx.quadraticCurveTo(shieldX, shieldY + 95, shieldX, shieldY + 65);
            ctx.lineTo(shieldX, shieldY + 18);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Inner shield glow
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(shieldX + shieldWidth / 2, shieldY + 12);
            ctx.lineTo(shieldX + shieldWidth - 10, shieldY + 27);
            ctx.lineTo(shieldX + shieldWidth - 10, shieldY + 60);
            ctx.quadraticCurveTo(shieldX + shieldWidth - 10, shieldY + 85, shieldX + shieldWidth / 2, shieldY + 98);
            ctx.quadraticCurveTo(shieldX + 10, shieldY + 85, shieldX + 10, shieldY + 60);
            ctx.lineTo(shieldX + 10, shieldY + 27);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fill();

            // Letter "C"
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.font = 'bold 52px Inter, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('C', shieldX + shieldWidth / 2, shieldY + 58);

            // Badge "M"
            ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 3;

            const badgeX = shieldX + shieldWidth - 12;
            const badgeY = shieldY + 12;
            const badgeRadius = 22;

            ctx.beginPath();
            ctx.arc(badgeX, badgeY, badgeRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#fbbf24';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 14px Inter, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('M', badgeX, badgeY + 1);

            // ==========================================
            // 2. TEXT (Right)
            // ==========================================
            const textX = shieldX + shieldWidth + 35;
            const textY = 55;

            ctx.shadowBlur = 0;

            // "Client"
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 38px Inter, Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText('Client', textX, textY + 5);

            // "Management" - Red
            const managementX = textX + ctx.measureText('Client').width + 8;
            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 38px Inter, Arial, sans-serif';
            ctx.fillText('Management', managementX, textY + 5);

            // "SYSTEM" subtitle
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 14px Inter, Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText('S Y S T E M', textX, textY + 52);

            // Decorative line
            const lineGrad = ctx.createLinearGradient(textX, 0, textX + 280, 0);
            lineGrad.addColorStop(0, '#dc2626');
            lineGrad.addColorStop(0.7, '#dc2626');
            lineGrad.addColorStop(1, 'rgba(220, 38, 38, 0)');

            ctx.beginPath();
            ctx.moveTo(textX, textY + 70);
            ctx.lineTo(textX + 280, textY + 70);
            ctx.strokeStyle = lineGrad;
            ctx.lineWidth = 3;
            ctx.stroke();

            // ==========================================
            // 3. Download
            // ==========================================
            const link = document.createElement('a');
            link.download = 'cms-logo-red-white.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Add keyboard shortcut (Ctrl+D or Cmd+D to download)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                e.preventDefault();
                downloadLogo();
            }
        });
    </script>

</body>
</html>
